packages:
  - packages/*
allowBuilds:
  esbuild: true
  oxc-resolver: true
  puppeteer: true
  sharp: true
  workerd: true
blockExoticSubdeps: true
catalog:
  "@aws-sdk/client-s3": ^3.1090.0
  "@cloudflare/workers-types": ^5.20260921.1
  "@mdx-js/mdx": ^3.1.1
  "@mermaid-js/mermaid-cli": ^11.4.2
  "@shikijs/langs": ^4.0.0
  "@shikijs/rehype": ^4.0.0
  "@shikijs/themes": ^4.0.0
  "@taga3s/atom-feed-composer": npm:@jsr/taga3s__atom-feed-composer@^0.1.1
  "@types/hast": ^3.0.4
  "@types/mdast": ^4.0.4
  "@types/node": ^24.12.2
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@types/unist": ^3.0.3
  discord.js: ^14.27.0
  gunshi: ^0.37.0
  hono: ^4.12.10
  jose: ^6.2.2
  puppeteer: ^25.0.0
  react: ^19.2.7
  react-dom: ^19.2.7
  rehype-parse: ^9.0.1
  rehype-stringify: ^10.0.1
  remark-frontmatter: ^5.0.0
  remark-gfm: ^4.0.1
  remark-mdx-frontmatter: ^6.0.0
  remark-parse: ^11.0.0
  remark-rehype: ^11.1.2
  remark-stringify: ^11.0.0
  satori: ^0.32.0
  shiki: ^4.0.0
  svg2png-wasm: ^1.4.1
  tsdown: ^0.23.0
  typescript: 7.0.2
  unified: ^11.0.5
  unist-util-visit: ^5.0.0
  vite-plus: ^0.3.3
  valibot: ^1.5.0
  wrangler: ^4.136.0
  yoga-wasm-web: ^0.3.3
minimumReleaseAge: 1
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
trustPolicy: no-downgrade
