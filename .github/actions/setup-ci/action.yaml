name: Setup CI
description: Setup CI environment

inputs:
  node-version:
    required: false
    description: "Specify Node.js version. If this is not specified, Node.js version specified in .node-version will be used"
  install-packages:
    required: false
    description: "List of packages to install. If this is not specified, all packages will be installed"
    default: ""

runs:
  using: "composite"
  steps:
    - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      with:
        node-version-file: .node-version
        run-install: false
        cache: true

    - run: vp install ${{ inputs.install-packages != '' && '--filter' || '' }} ${{ inputs.install-packages }} --frozen-lockfile
      shell: bash
