name: Setup CI
description: Setup CI environment

inputs:
  node-version:
    required: false
    description: "Specify Node.js version. If this is not specified, Node.js version specified in .node-version will be used"
  install-packages:
    required: false
    description: "List of packages to install. If this is not specified, all packages will be installed"
    default: "."

runs:
  using: "composite"
  steps:
    - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
      with:
        node-version-file: .node-version
        run-install: false
        cache: true

    - run: vp install --filter ${{ inputs.install-packages }} --frozen-lockfile
      shell: bash
