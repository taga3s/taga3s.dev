name: deploy

on:
  push:
    branches:
      - main
    paths:
      - "packages/website/**"
      - "packages/assets-proxy/**"
      - "packages/mdx-processor/**"
      - "assets/blog/**"
      - ".github/workflows/deploy.yaml"

jobs:
  changes:
    runs-on: ubuntu-slim
    outputs:
      website-changed: ${{ steps.changes.outputs.website }}
      assets-proxy-changed: ${{ steps.changes.outputs.assets-proxy }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            workflows: &workflows
              - '.github/workflows/deploy.yaml'
            blog-assets: &blog-assets
              - 'assets/blog/**'
            mdx-processor: &mdx-processor
              - 'packages/mdx-processor/**'
            website:
              - *workflows
              - *blog-assets
              - *mdx-processor
              - 'packages/website/**'
            assets-proxy:
              - *workflows
              - 'packages/assets-proxy/**'

  run-mdx-processor:
    needs: [changes]
    if: needs.changes.outputs.website-changed
    uses: $/.github/workflows/reusable_run-mdx-processor.yaml
    secrets: inherit

  deploy-website:
    needs: [run-mdx-processor]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.website-changed

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: $/.github/actions/setup-ci
        with:
          install-packages: "@taga3s-dev/website"

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atom.xml
          path: ${{ github.workspace }}/packages/website/public

      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --minify --config wrangler.jsonc
          workingDirectory: ./packages/website
        env:
          POLICY_AUD: ${{ secrets.CLOUDFLARE_ACCESS_AUD }}
          TEAM_DOMAIN: ${{ secrets.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}

  deploy-assets-proxy:
    needs: [changes]
    if: needs.changes.outputs.assets-proxy-changed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: $/.github/actions/setup-ci
        with:
          install-packages: "@taga3s-dev/assets-proxy"

      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --minify --config wrangler.jsonc
          workingDirectory: ./packages/assets-proxy
